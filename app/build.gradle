apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // MoonCast's own numbering (Moonlight's was 12.2 / 315). versionCode only ever goes up: 1.0 = 1000, 1.0.1 = 1001, 1.1 = 1100
        // A beta overrides both, below the release it leads to: -PmcVersionName=1.0-beta1 -PmcVersionCode=991
        versionName (project.findProperty("mcVersionName") ?: "1.0")
        versionCode = (project.findProperty("mcVersionCode") ?: "1000").toString().toInteger()

        // MoonCast TV dev build: arm64 only (the stick + JAL TV are arm64) to keep the native compile within memory,
        // and limit parallel native jobs so Gradle + ndk-build don't OOM the 4 GB builder.
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    flavorDimensions.add("root")
    // Which app this is. tv = MoonCast TV, always the RECEIVER (its home + the :8099 listener, src/tv).
    // handheld = MoonCast for Odin-style handhelds and phones, always the SENDER (src/handheld).
    // Everything else (Moonlight, PS5, Xbox, sign-ins, settings, Quick menu) is shared in src/main.
    flavorDimensions.add("role")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot", "-j2"
                }
            }

            applicationId "me.mooncast.tv"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    productFlavors {
        tv {
            dimension "role"
            buildConfigField "boolean", "TV_APP", "true"
        }
        handheld {
            dimension "role"
            buildConfigField "boolean", "TV_APP", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // Release signing: MoonCast's own key, never in git. keystore.properties (storeFile, storePassword, keyAlias,
    // keyPassword) sits next to settings.gradle, or MOONCAST_KEYSTORE names it. Without it, release builds come out
    // unsigned, as before.
    def keystoreFile = System.getenv("MOONCAST_KEYSTORE") ? new File(System.getenv("MOONCAST_KEYSTORE")) : rootProject.file("keystore.properties")
    if (keystoreFile.exists()) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks.getProperty("storeFile"))
                storePassword ks.getProperty("storePassword")
                keyAlias ks.getProperty("keyAlias")
                keyPassword ks.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            // test builds: BUILD=testN ./gradlew ... puts the build name in the version (shown in Settings, About)
            versionNameSuffix "-" + (System.getenv("BUILD") ?: "dev")
        }
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            // MoonCast TV: our own application id (as the upstream author asks forks to do)

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    // Google's WebRTC (libwebrtc) for Xbox Remote Play, the build XStreaming's player uses (react-native-webrtc 124)
    implementation 'org.jitsi:webrtc:124.0.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// Per app: its own application id (both can be installed side by side) and its own name.
androidComponents {
    onVariants(selector().all()) { variant ->
        def handheld = variant.productFlavors.any { it.second == "handheld" }
        if (handheld) variant.applicationId.set(variant.applicationId.get().replace("me.mooncast.tv", "me.mooncast.handheld"))
        def name = handheld ? "MoonCast" : "MoonCast TV"
        def debug = variant.buildType == "debug"
        variant.resValues.put(variant.makeResValueKey("string", "app_label"),
            new com.android.build.api.variant.ResValue(name + (debug ? " (Debug)" : ""), null))
        variant.resValues.put(variant.makeResValueKey("string", "app_label_root"),
            new com.android.build.api.variant.ResValue(name + (debug ? " (Root Debug)" : " (Root)"), null))
    }
}

// PS5 Remote Play: libchiaki-jni.so (with liboboe.so and libc++_shared.so) is built from source, from the
// third-party/chiaki-ng submodule (MoonCastDev/chiaki-ng-mooncast, chiaki-ng with MoonCast's changes, AGPL-3.0).
// It runs again only when chiaki's sources change. The libraries land in src/main/jniLibs, which git ignores.
// Needs CMake 3.22.1 in the SDK and protoc on the PATH (see third-party/chiaki-ng/mooncast/README.md).
def chiakiDir = rootProject.file('third-party/chiaki-ng')
def chiakiLibs = ['arm64-v8a', 'armeabi-v7a'].collectMany { abi ->
    ['libchiaki-jni.so', 'liboboe.so', 'libc++_shared.so'].collect { file("src/main/jniLibs/$abi/$it") }
}
tasks.register('buildChiaki', Exec) {
    description = 'Builds the PS5 Remote Play libraries from third-party/chiaki-ng'
    inputs.files(fileTree(chiakiDir) {
        include 'CMakeLists.txt', 'cmake/**', 'lib/**', 'android/app/CMakeLists.txt', 'android/app/build.gradle', 'android/app/src/main/cpp/**', 'mooncast/build-jni.sh'
        exclude 'android/app/src/main/cpp/oboe/**'
    })
    outputs.files(chiakiLibs)
    // the script finds the SDK from ANDROID_HOME or local.properties
    commandLine 'sh', new File(chiakiDir, 'mooncast/build-jni.sh').path, rootProject.projectDir.path
    doFirst {
        if (!new File(chiakiDir, 'mooncast/build-jni.sh').exists()) {
            throw new GradleException("third-party/chiaki-ng is empty: run git submodule update --init --recursive")
        }
    }
}
tasks.named('preBuild') { dependsOn 'buildChiaki' }
