<html><head><style>
@font-face{font-family:F;src:url(Figtree.ttf);font-weight:100 900}
body{margin:0;width:1968px;height:1248px;background:#1e2024;font-family:F;color:#fff;overflow:hidden}
.h{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:40px;font-weight:800}
.sub{position:absolute;top:84px;left:0;right:0;text-align:center;font-size:24px;color:#B5BAC3}
.pane{position:absolute;top:150px;width:944px;height:944px;border-radius:14px;overflow:hidden;background:#000}
.l{left:30px}.r{left:994px}
.lab{position:absolute;bottom:18px;left:18px;font-size:28px;font-weight:800;background:rgba(0,0,0,.65);padding:8px 16px;border-radius:10px}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:22px;color:#B5BAC3}
#status{position:absolute;top:120px;left:30px;font-size:18px;color:#f88}
canvas{display:block}
</style></head><body>
<div class="h">Super resolution: a 720p stream on a 2448 × 1696 screen</div>
<div class="sub">The same frame, enlarged 3.4×; a close-up of the middle of the picture</div>
<div class="pane l"><canvas id="a" width="944" height="944"></canvas><div class="lab">Off: plain enlargement</div></div>
<div class="pane r"><canvas id="b" width="944" height="944"></canvas><div class="lab">FSR 1.0, sharpening 60%</div></div>
<div class="foot">Rendered by MoonCast's own FSR 1.0 shaders (EASU + RCAS, the code in the app), run here in WebGL 2.</div>
<div id="status"></div>
<script>
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b5ea8"/><stop offset="1" stop-color="#9cc7ef"/></linearGradient>
<pattern id="brick" width="32" height="16" patternUnits="userSpaceOnUse"><rect width="32" height="16" fill="#b4542e"/><path d="M0 0H32M0 8H32M16 0V8M0 8V16M32 8V16" stroke="#6e2a13" stroke-width="1.4"/></pattern>
<pattern id="grass" width="6" height="10" patternUnits="userSpaceOnUse"><path d="M1 10L3 0L5 10" fill="#3f9a3a"/></pattern></defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<g fill="#fff" opacity=".9"><ellipse cx="220" cy="120" rx="90" ry="28"/><ellipse cx="900" cy="90" rx="120" ry="30"/></g>
<path d="M0 470 Q200 330 420 430 T860 400 T1280 420 V720 H0Z" fill="#4c8a46"/>
<path d="M0 520 Q300 420 640 500 T1280 480 V720 H0Z" fill="#3a7537"/>
<rect y="600" width="1280" height="120" fill="url(#brick)"/>
<rect y="586" width="1280" height="16" fill="url(#grass)"/>
<g transform="translate(560,380)"><rect x="0" y="0" width="160" height="40" fill="url(#brick)" stroke="#5a200c" stroke-width="2"/>
<rect x="190" y="-70" width="40" height="40" fill="#f2b33d" stroke="#7a4a05" stroke-width="2"/><text x="210" y="-41" font-family="Arial" font-weight="900" font-size="28" text-anchor="middle" fill="#7a4a05">?</text></g>
<g transform="translate(610,470)"><rect x="-14" y="0" width="56" height="16" rx="3" fill="#d42f2f"/><rect x="-6" y="16" width="40" height="40" fill="#f3c9a3"/>
<circle cx="24" cy="32" r="3" fill="#111"/><rect x="-10" y="56" width="48" height="50" fill="#d42f2f"/>
<g stroke="#8a1616" stroke-width="1.2">${Array.from({length:9},(_,i)=>`<path d="M${-10+i*6} 56V106"/>`).join('')}</g>
<rect x="-10" y="106" width="20" height="10" fill="#2f4bd4"/><rect x="18" y="106" width="20" height="10" fill="#2f4bd4"/></g>
<g font-family="Arial" font-weight="900" fill="#fff" stroke="#000" stroke-width="1.2"><text x="40" y="58" font-size="34">SCORE 012300</text><text x="1240" y="58" font-size="34" text-anchor="end">TIME 247</text></g>
<g font-family="Arial" font-size="15" fill="#fff"><text x="40" y="84">WORLD 1-2 · COINS ×24 · LIVES 3</text></g>
<g stroke="#333" stroke-width="1"><path d="M840 470 L1000 330 M850 470 L1010 330 M860 470 L1020 330"/></g>
<g transform="translate(860,300)">${Array.from({length:6},(_,i)=>`<circle cx="${i*30}" cy="0" r="9" fill="#f7cf3b" stroke="#8a6a00" stroke-width="2"/>`).join('')}</g>
</svg>`;
const VERT=`#version 300 es
out vec2 vUv;
void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    vUv = p;
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`, EASU=`#version 300 es
precision highp float;
precision highp int;
uniform highp sampler2D uTex;
uniform vec4 uCon0;
uniform vec4 uCon1;
uniform vec4 uCon2;
uniform vec4 uCon3;
uniform ivec2 uInSize;
out vec4 o;

vec3 texel(ivec2 p) { return texelFetch(uTex, clamp(p, ivec2(0), uInSize - 1), 0).rgb; }
// textureGather at a texel corner p: x = (left, upper+1), y = (left+1, upper+1), z = (left+1, upper), w = (left, upper)
void gather(vec2 p, out vec3 x, out vec3 y, out vec3 z, out vec3 w) {
    ivec2 tl = ivec2(floor(p * vec2(uInSize) + 0.5)) - 1;
    x = texel(tl + ivec2(0, 1)); y = texel(tl + ivec2(1, 1)); z = texel(tl + ivec2(1, 0)); w = texel(tl);
}
float luma(vec3 c) { return c.b * 0.5 + (c.r * 0.5 + c.g); }
float rcp(float x) { return 1.0 / max(x, 1.0e-8); }

void tap(inout vec3 aC, inout float aW, vec2 off, vec2 dir, vec2 len, float lob, float clp, vec3 c) {
    vec2 v;
    v.x = (off.x * ( dir.x)) + (off.y * dir.y);
    v.y = (off.x * (-dir.y)) + (off.y * dir.x);
    v *= len;
    float d2 = min(v.x * v.x + v.y * v.y, clp);
    float wB = 2.0 / 5.0 * d2 - 1.0;
    float wA = lob * d2 - 1.0;
    wB *= wB;
    wA *= wA;
    wB = 25.0 / 16.0 * wB - (25.0 / 16.0 - 1.0);
    float w = wB * wA;
    aC += c * w; aW += w;
}

void set(inout vec2 dir, inout float len, vec2 pp, int corner, float lA, float lB, float lC, float lD, float lE) {
    float w = 0.0;
    if (corner == 0) w = (1.0 - pp.x) * (1.0 - pp.y);
    if (corner == 1) w = pp.x * (1.0 - pp.y);
    if (corner == 2) w = (1.0 - pp.x) * pp.y;
    if (corner == 3) w = pp.x * pp.y;
    float dc = lD - lC;
    float cb = lC - lB;
    float lenX = rcp(max(abs(dc), abs(cb)));
    float dirX = lD - lB;
    dir.x += dirX * w;
    lenX = clamp(abs(dirX) * lenX, 0.0, 1.0);
    lenX *= lenX;
    len += lenX * w;
    float ec = lE - lC;
    float ca = lC - lA;
    float lenY = rcp(max(abs(ec), abs(ca)));
    float dirY = lE - lA;
    dir.y += dirY * w;
    lenY = clamp(abs(dirY) * lenY, 0.0, 1.0);
    lenY *= lenY;
    len += lenY * w;
}

void main() {
    vec2 pp = floor(gl_FragCoord.xy) * uCon0.xy + uCon0.zw;
    vec2 fp = floor(pp);
    pp -= fp;
    vec2 p0 = fp * uCon1.xy + uCon1.zw;
    vec2 p1 = p0 + uCon2.xy;
    vec2 p2 = p0 + uCon2.zw;
    vec2 p3 = p0 + uCon3.xy;
    vec3 b, c, z0, w0, i, j, f, e, k, l, h, g, x3, y3, oo, n;
    gather(p0, b, c, z0, w0);
    gather(p1, i, j, f, e);
    gather(p2, k, l, h, g);
    gather(p3, x3, y3, oo, n);
    float bL = luma(b), cL = luma(c), iL = luma(i), jL = luma(j), fL = luma(f), eL = luma(e);
    float kL = luma(k), lL = luma(l), hL = luma(h), gL = luma(g), oL = luma(oo), nL = luma(n);
    vec2 dir = vec2(0.0);
    float len = 0.0;
    set(dir, len, pp, 0, bL, eL, fL, gL, jL);
    set(dir, len, pp, 1, cL, fL, gL, hL, kL);
    set(dir, len, pp, 2, fL, iL, jL, kL, nL);
    set(dir, len, pp, 3, gL, jL, kL, lL, oL);
    vec2 dir2 = dir * dir;
    float dirR = dir2.x + dir2.y;
    bool zro = dirR < 1.0 / 32768.0;
    dirR = inversesqrt(max(dirR, 1.0e-12));
    dirR = zro ? 1.0 : dirR;
    dir.x = zro ? 1.0 : dir.x;
    dir *= vec2(dirR);
    len = len * 0.5;
    len *= len;
    float stretch = (dir.x * dir.x + dir.y * dir.y) * rcp(max(abs(dir.x), abs(dir.y)));
    vec2 len2 = vec2(1.0 + (stretch - 1.0) * len, 1.0 - 0.5 * len);
    float lob = 0.5 + ((1.0 / 4.0 - 0.04) - 0.5) * len;
    float clp = rcp(lob);
    vec3 min4 = min(min(min(f, g), j), k);
    vec3 max4 = max(max(max(f, g), j), k);
    vec3 aC = vec3(0.0);
    float aW = 0.0;
    tap(aC, aW, vec2( 0.0, -1.0) - pp, dir, len2, lob, clp, b);
    tap(aC, aW, vec2( 1.0, -1.0) - pp, dir, len2, lob, clp, c);
    tap(aC, aW, vec2(-1.0,  1.0) - pp, dir, len2, lob, clp, i);
    tap(aC, aW, vec2( 0.0,  1.0) - pp, dir, len2, lob, clp, j);
    tap(aC, aW, vec2( 0.0,  0.0) - pp, dir, len2, lob, clp, f);
    tap(aC, aW, vec2(-1.0,  0.0) - pp, dir, len2, lob, clp, e);
    tap(aC, aW, vec2( 1.0,  1.0) - pp, dir, len2, lob, clp, k);
    tap(aC, aW, vec2( 2.0,  1.0) - pp, dir, len2, lob, clp, l);
    tap(aC, aW, vec2( 2.0,  0.0) - pp, dir, len2, lob, clp, h);
    tap(aC, aW, vec2( 1.0,  0.0) - pp, dir, len2, lob, clp, g);
    tap(aC, aW, vec2( 1.0,  2.0) - pp, dir, len2, lob, clp, oo);
    tap(aC, aW, vec2( 0.0,  2.0) - pp, dir, len2, lob, clp, n);
    o = vec4(min(max4, max(min4, aC * rcp(aW))), 1.0);
}`, RCAS=`#version 300 es
precision highp float;
precision highp int;
uniform highp sampler2D uTex;
uniform float uSharp;
uniform ivec2 uSize;
out vec4 o;
vec3 texel(ivec2 p) { return texelFetch(uTex, clamp(p, ivec2(0), uSize - 1), 0).rgb; }
void main() {
    ivec2 sp = ivec2(gl_FragCoord.xy);
    vec3 b = texel(sp + ivec2(0, -1));
    vec3 d = texel(sp + ivec2(-1, 0));
    vec3 e = texel(sp);
    vec3 f = texel(sp + ivec2(1, 0));
    vec3 h = texel(sp + ivec2(0, 1));
    vec3 mn4 = min(min(b, d), min(f, h));
    vec3 mx4 = max(max(b, d), max(f, h));
    vec3 hitMin = min(mn4, e) / max(4.0 * mx4, vec3(1.0e-5));
    vec3 hitMax = (1.0 - max(mx4, e)) / min(4.0 * mn4 - 4.0, vec3(-1.0e-5));
    vec3 lobeRGB = max(-hitMin, hitMax);
    float lobe = max(-(0.25 - 1.0 / 16.0), min(max(lobeRGB.r, max(lobeRGB.g, lobeRGB.b)), 0.0)) * uSharp;
    o = vec4((lobe * (b + d + h + f) + e) / (4.0 * lobe + 1.0), 1.0);
}`;
const say=t=>document.getElementById('status').textContent+=t+' ';
const img=new Image();
img.onload=()=>{ try {
  const W=1280,H=720, scale=3.4, outW=Math.round(W*scale), outH=Math.round(H*scale);
  const low=document.createElement('canvas'); low.width=W; low.height=H;
  low.getContext('2d').drawImage(img,0,0,W,H);
  // crop region in output space (centre of the earlier illustration)
  const sx=Math.round(500*scale), sy=Math.round(330*scale), S=944;
  // left: plain enlargement
  const a=document.getElementById('a').getContext('2d'); a.imageSmoothingEnabled=true; a.imageSmoothingQuality='medium';
  a.drawImage(low, 500, 330, S/scale, S/scale, 0, 0, S, S);
  // right: our shaders. WebGL2 needs a canvas of the full output size
  const gc=document.createElement('canvas'); gc.width=outW; gc.height=outH;
  const gl=gc.getContext('webgl2',{preserveDrawingBuffer:true}); if(!gl){say('no webgl2');return;}
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;}
  function prog(f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
  function tex(w,h,data){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA8,w,h);
    if(data){gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,data);}
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);return t;}
  const src=tex(W,H,low), mid=tex(outW,outH,null);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,mid,0);
  const pe=prog(EASU), pr=prog(RCAS); gl.bindVertexArray(gl.createVertexArray());
  gl.viewport(0,0,outW,outH); gl.useProgram(pe); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src);
  const u=(p,n)=>gl.getUniformLocation(p,n);
  gl.uniform1i(u(pe,'uTex'),0);
  gl.uniform4f(u(pe,'uCon0'),W/outW,H/outH,0.5*W/outW-0.5,0.5*H/outH-0.5);
  gl.uniform4f(u(pe,'uCon1'),1/W,1/H,1/W,-1/H); gl.uniform4f(u(pe,'uCon2'),-1/W,2/H,1/W,2/H); gl.uniform4f(u(pe,'uCon3'),0,4/H,0,0);
  gl.uniform2i(u(pe,'uInSize'),W,H); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.useProgram(pr); gl.bindTexture(gl.TEXTURE_2D,mid);
  gl.uniform1i(u(pr,'uTex'),0); gl.uniform1f(u(pr,'uSharp'),Math.pow(2,-((1-0.6)*2))); gl.uniform2i(u(pr,'uSize'),outW,outH);
  gl.drawArrays(gl.TRIANGLES,0,3);
  { const err=gl.getError(); if(err) say('gl error '+err); }
  // GL rows go bottom-up; the canvas shows it upright. Copy the same crop
  document.getElementById('b').getContext('2d').drawImage(gc, sx, sy, S, S, 0, 0, S, S);
  document.title='done';
 } catch(e){ say('ERROR '+e); } };
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
</script></body></html>
