name: Something doesn't work
description: Tell us what went wrong in MoonCast
title: "[Bug]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing MoonCast! A few details help us find the problem quickly.
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - MoonCast (phone, handheld, tablet)
        - MoonCast TV (Android TV / Google TV)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MoonCast version
      description: Settings, About (for example 1.0-beta1)
      placeholder: 1.0-beta1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Samsung Galaxy Z Fold, Android 16 / AYN Odin 2 Portal, Android 13 / Chromecast with Google TV"
    validations:
      required: true
  - type: dropdown
    id: playing
    attributes:
      label: What were you playing
      multiple: true
      options:
        - PC (Sunshine)
        - PS5
        - Xbox
        - Nothing yet (menus, pairing, sign-in)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you
      options:
        - At home (same network as the PC or console)
        - Away from home (another network, mobile data, a hotspot)
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots or a short video help a lot.
      placeholder: |
        1. Opened MoonCast and pressed Play on my PS5
        2. It said "Connecting…" for a minute
        3. Then "Couldn't reach your PlayStation"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Controller used, Wi-Fi or cable, how often it happens, anything you noticed.
